renew_service:
  name: 续订服务
  description: 为虚拟服务增加一期费用并延长到期日。
  fields:
    entity_id:
      name: 陪伴实体
      description: HomeAsset Companion 主传感器实体。
      required: true
      selector:
        entity:
          domain: sensor
    cost:
      name: 本次费用
      description: 留空时按套餐月费乘以延长月数计算；旧条目无套餐月费时沿用当前周期费用。
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: 元
    months:
      name: 延长月数
      description: 留空时按标准续订周期延长；它可以与当前预付覆盖月数不同。
      required: false
      selector:
        number:
          min: 1
          max: 120
          step: 1
          mode: box
    expiration_date:
      name: 新到期日
      description: 设置后优先使用此日期，不再按月份自动推算。
      required: false
      selector:
        date:

record_service_charge:
  name: 记录订阅附加支出
  description: 记录升级差价或本期额外额度费用，不改变服务到期日。
  fields:
    entity_id:
      name: 陪伴实体
      description: HomeAsset Companion 主传感器实体。
      required: true
      selector:
        entity:
          domain: sensor
    charge_type:
      name: 支出类型
      description: 升级差价、额外额度或其他订阅附加费用。
      required: true
      selector:
        select:
          options:
            - label: 升级订阅
              value: upgrade
            - label: 额外额度
              value: extra_quota
            - label: 其他
              value: other
    cost:
      name: 已支付金额
      description: 只填写实际已经支付的增量金额。
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: 元
    new_monthly_price:
      name: 升级后套餐月费
      description: 仅升级订阅时填写；用于后续续订默认金额，不改变当前到期日。
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: 元
    description:
      name: 说明
      description: 可填写套餐名称、额度数量或账单备注。
      required: false
      selector:
        text:

replace_consumable:
  name: 确认更换耗材
  description: 记录耗材更换日期和本次实际费用。
  fields:
    entity_id:
      name: 陪伴实体
      required: true
      selector:
        entity:
          domain: sensor
    cons_id:
      name: 耗材 ID
      required: true
      selector:
        text:
    cost:
      name: 本次费用
      description: 留空时使用耗材默认价格。
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: 元

set_lifecycle:
  name: 设置生命周期状态
  description: 修改主体状态；终止类状态会冻结陪伴天数与当前运行成本。
  fields:
    entity_id:
      name: 陪伴实体
      required: true
      selector:
        entity:
          domain: sensor
    status:
      name: 状态
      required: true
      selector:
        select:
          options:
            - label: 正常使用
              value: active
            - label: 闲置持有
              value: idle
            - label: 已封存
              value: archived
            - label: 二手售出
              value: sold
            - label: 已报废
              value: scrapped
            - label: 已遗失
              value: lost
            - label: 已赠出
              value: gifted
            - label: 已取消
              value: canceled
    recovery_amount:
      name: 回收金额
      description: 仅在二手售出状态下计入。
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: 元

update_item_image:
  name: 更新附属项目图片
  description: 更新耗材、配件、纪念单品或附加权益的图片地址。
  fields:
    entity_id:
      name: 陪伴实体
      required: true
      selector:
        entity:
          domain: sensor
    item_id:
      name: 项目 ID
      required: true
      selector:
        text:
    image_url:
      name: 图片地址
      required: true
      selector:
        text:
