adjust_service_bill:
  name: 退款或更正订阅账单
  description: 保留原账单并新增关联更正记录。金额按差额调整；更正实际付款日期时替换原账期，按原覆盖月数重算到期日。退款不改变账期，套餐月费不变。仅记账，不向平台申请退款。已有退款的账单不能更正。
  fields:
    entity_id:
      name: 陪伴实体
      required: true
      selector:
        entity:
          domain: sensor
    bill_id:
      name: 原账单 ID
      required: true
      selector:
        text:
    operation:
      name: 调整类型
      required: true
      selector:
        select:
          options:
            - label: 退款
              value: refund
            - label: 更正金额 / 付款日期
              value: correction
    cost:
      name: 退款金额或更正后的原付款总金额
      description: 退款填实际收到的正数金额；更正填正确的原付款总金额，不是差额。最多两位小数。
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
    paid_at:
      name: 调整记录日期 / 收到退款的日期
      description: 默认今天，不得早于原付款或已有调整日期，也不能晚于今天。
      selector:
        date:
    corrected_paid_at:
      name: 更正后的实际付款日期
      description: 仅 correction 使用，可早于原错误付款日期，但不得早于服务首次起始日或晚于今天。付款日期就是该订阅账期起点，按原覆盖月数重算到期日；只改日期时金额填写当前更正后的原付款总额。留空只更正金额。
      selector:
        date:
    description:
      name: 调整原因
      required: true
      selector:
        text:
    request_id:
      name: 调整请求编号
      description: 每笔必须提供稳定的唯一编号，重试沿用同一编号，防止重复调整。
      required: true
      selector:
        text:

renew_service:
  name: 续订服务
  description: 为虚拟服务增加一期费用并延长到期日。
  fields:
    request_id:
      name: 付款请求编号
      description: 同一笔付款重试请沿用相同编号，避免重复记账；编号不可用于不同付款。
      selector:
        text:
    paid_at:
      name: 实际付款日期
      description: 填写时用作该账期起点，按覆盖月数计算到期日；不能填写未来日期或早于服务首次起始日。省略此字段的旧服务调用仍从有效到期日续期。
      selector:
        date:
    entity_id:
      name: 陪伴实体
      description: HomeAsset Companion 主传感器实体。
      required: true
      selector:
        entity:
          domain: sensor
    cost:
      name: 本次费用
      description: 留空时按套餐月费乘以延长月数计算；旧条目无套餐月费时沿用当前周期费用。
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: 元
    months:
      name: 延长月数
      description: 留空时按标准续订周期延长；它可以与当前预付覆盖月数不同。
      required: false
      selector:
        number:
          min: 1
          max: 120
          step: 1
          mode: box
    expiration_date:
      name: 新到期日
      description: 设置后优先使用此日期，不再按月份自动推算。
      required: false
      selector:
        date:

renew_service_perk:
  name: 续订赠送权益
  description: 同步主服务已登记的账期，或单独登记赠送权益的期限。不新增付款，不改变主服务日期或权益价值，保留首次生效日期和旧账期。已取消的权益须先在集成设置中恢复。
  fields:
    entity_id:
      name: 主服务陪伴实体
      required: true
      selector:
        entity:
          domain: sensor
    perk_id:
      name: 权益 ID
      required: true
      selector:
        text:
    follow_main_renewal:
      name: 跟随主服务续订
      description: 默认开启，同步当前已登记的主服务账期，并在今后主服务续订或更正当前付款日期时自动同步。
      default: true
      selector:
        boolean:
    start_date:
      name: 独立权益生效日期
      description: 仅关闭跟随时填写，不得早于首次生效日期。
      selector:
        date:
    expiration_date:
      name: 独立到期日
      description: 仅关闭跟随时填写，须晚于生效日期和今天。
      selector:
        date:
    request_id:
      name: 操作请求编号
      description: 重试同一操作时沿用编号，防止重复登记。
      selector:
        text:

record_service_charge:
  name: 记录订阅附加支出
  description: 记录升级差价或本期额外额度费用，不改变服务到期日。
  fields:
    request_id:
      name: 付款请求编号
      description: 同一笔付款重试请沿用相同编号。
      selector:
        text:
    paid_at:
      name: 实际付款日期
      description: 补记历史付款时填写实际日期，追加费用计入该自然月。
      selector:
        date:
    entity_id:
      name: 陪伴实体
      description: HomeAsset Companion 主传感器实体。
      required: true
      selector:
        entity:
          domain: sensor
    charge_type:
      name: 支出类型
      description: 升级差价、额外额度或其他订阅附加费用。
      required: true
      selector:
        select:
          options:
            - label: 升级订阅
              value: upgrade
            - label: 额外额度
              value: extra_quota
            - label: 其他
              value: other
    cost:
      name: 已支付金额
      description: 只填写实际已经支付的增量金额。
      required: true
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: 元
    new_monthly_price:
      name: 升级后套餐月费
      description: 仅升级订阅时填写；用于后续续订默认金额，不改变当前到期日。
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: 元
    description:
      name: 说明
      description: 可填写套餐名称、额度数量或账单备注。
      required: false
      selector:
        text:

replace_consumable:
  name: 确认更换耗材
  description: 记录耗材更换日期和本次实际费用。
  fields:
    entity_id:
      name: 陪伴实体
      required: true
      selector:
        entity:
          domain: sensor
    cons_id:
      name: 耗材 ID
      required: true
      selector:
        text:
    cost:
      name: 本次费用
      description: 留空时使用耗材默认价格。
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: 元

set_lifecycle:
  name: 设置生命周期状态
  description: 修改主体状态；终止类状态会冻结陪伴天数与当前运行成本。
  fields:
    entity_id:
      name: 陪伴实体
      required: true
      selector:
        entity:
          domain: sensor
    status:
      name: 状态
      required: true
      selector:
        select:
          options:
            - label: 正常使用
              value: active
            - label: 闲置持有
              value: idle
            - label: 已封存
              value: archived
            - label: 二手售出
              value: sold
            - label: 已报废
              value: scrapped
            - label: 已遗失
              value: lost
            - label: 已赠出
              value: gifted
            - label: 已取消
              value: canceled
    recovery_amount:
      name: 回收金额
      description: 仅在二手售出状态下计入。
      required: false
      selector:
        number:
          min: 0
          max: 1000000
          step: 0.01
          mode: box
          unit_of_measurement: 元

update_item_image:
  name: 更新附属项目图片
  description: 更新耗材、配件、纪念单品或附加权益的图片地址。
  fields:
    entity_id:
      name: 陪伴实体
      required: true
      selector:
        entity:
          domain: sensor
    item_id:
      name: 项目 ID
      required: true
      selector:
        text:
    image_url:
      name: 图片地址
      required: true
      selector:
        text:
